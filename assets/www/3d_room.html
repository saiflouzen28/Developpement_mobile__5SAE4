<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>3D Virtual Room</title>
    <style> body { margin: 0; overflow: hidden; background-color: #000; } canvas { width: 100%; height: 100% } </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, camera, renderer, player, clock, controls;
    let targetPosition = null;
    const move = { forward: 0, turn: 0 };
    const keyboardState = {};

    let mixer;
    const animationActions = {};
    let activeAction;

    let lastUpdateTime = 0;
    const UPDATE_INTERVAL = 100;

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x101010);
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.minDistance = 2;
        controls.maxDistance = 50;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(15, 25, 20);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        const textureLoader = new THREE.TextureLoader();
        const roomSize = 40;
        const floorColorMap = textureLoader.load('/assets/textures/floor_color.png');
        const floorRoughnessMap = textureLoader.load('/assets/textures/floor_roughness.png');
        const floorAOMap = textureLoader.load('/assets/textures/floor_ao.png');

        [floorColorMap, floorRoughnessMap, floorAOMap].forEach(map => {
            map.wrapS = THREE.RepeatWrapping;
            map.wrapT = THREE.RepeatWrapping;
            map.repeat.set(roomSize / 4, roomSize / 4);
        });

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(roomSize, roomSize),
            new THREE.MeshStandardMaterial({ map: floorColorMap, roughnessMap: floorRoughnessMap, aoMap: floorAOMap })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        ground.geometry.setAttribute('uv2', new THREE.BufferAttribute(ground.geometry.attributes.uv.array, 2));
        scene.add(ground);

        const wallColorMap = textureLoader.load('/assets/textures/wall_color.png');
        const wallRoughnessMap = textureLoader.load('/assets/textures/wall_roughness.png');
        const wallAOMap = textureLoader.load('/assets/textures/wall_ao.png');
        [wallColorMap, wallRoughnessMap, wallAOMap].forEach(map => {
            map.wrapS = THREE.RepeatWrapping; map.wrapT = THREE.RepeatWrapping; map.repeat.set(roomSize / 4, 2);
        });
        const wallHeight = 8;
        const wallMaterial = new THREE.MeshStandardMaterial({ map: wallColorMap, roughnessMap: wallRoughnessMap, aoMap: wallAOMap });
        const wallPositions = [
            { pos: [0, wallHeight / 2, -roomSize / 2], size: [roomSize, wallHeight, 0.1] },
            { pos: [0, wallHeight / 2, roomSize / 2], size: [roomSize, wallHeight, 0.1] },
            { pos: [-roomSize / 2, wallHeight / 2, 0], size: [0.1, wallHeight, roomSize] },
            { pos: [roomSize / 2, wallHeight / 2, 0], size: [0.1, wallHeight, roomSize] },
        ];
        wallPositions.forEach(data => {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(...data.size), wallMaterial);
            wall.position.set(...data.pos);
            wall.receiveShadow = true;
            wall.geometry.setAttribute('uv2', new THREE.BufferAttribute(wall.geometry.attributes.uv.array, 2));
            scene.add(wall);
        });

        function createFurniture(geometry, color, position, rotationY = 0) {
            const material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.7, metalness: 0.1 });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(...position);
            mesh.rotation.y = rotationY;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
        }
        createFurniture(new THREE.BoxGeometry(4, 1.5, 2), 0x8B4513, [-10, 0.75, -15], Math.PI / 4);
        createFurniture(new THREE.BoxGeometry(2, 0.8, 1.5), 0xA0522D, [-7, 0.4, -13], Math.PI / 4);
        createFurniture(new THREE.CylinderGeometry(1, 1, 2, 32), 0x333333, [12, 1, 10]);
        createFurniture(new THREE.SphereGeometry(1.5, 32, 16), 0x228B22, [12, 3, 10]);

        const loader = new GLTFLoader();
        loader.load('/assets/models/casual_man_animated.glb', function (gltf) {
            player = gltf.scene;
            player.scale.set(0.9, 0.9, 0.9);
            player.traverse(node => { if (node.isMesh) node.castShadow = true; });
            scene.add(player);

            mixer = new THREE.AnimationMixer(player);

            const idleClip = THREE.AnimationClip.findByName(gltf.animations, 'Idle');
            const runClip = THREE.AnimationClip.findByName(gltf.animations, 'Running');

            if (idleClip) {
                animationActions.idle = mixer.clipAction(idleClip);
                animationActions.idle.play();
                activeAction = animationActions.idle;
            }
            if (runClip) {
                animationActions.run = mixer.clipAction(runClip);
            }

            controls.target.set(player.position.x, player.position.y + 1, player.position.z);
            animate();
        }, undefined, (error) => console.error('Model load error:', error));

        clock = new THREE.Clock();
        document.addEventListener('keydown', (event) => { keyboardState[event.code] = true; });
        document.addEventListener('keyup', (event) => { keyboardState[event.code] = false; });
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data.type === 'joystick') {
                move.forward = data.forward;
                move.turn = data.turn;
                targetPosition = null;
            } else if (data.type === 'move-to') {
                targetPosition = new THREE.Vector3(data.x, 0, data.z);
            }
        });
    }

    function setAction(toAction) {
        if (toAction !== activeAction) {
            const fromAction = activeAction;
            activeAction = toAction;

            if (fromAction) {
                fromAction.fadeOut(0.3);
            }

            activeAction
                .reset()
                .setEffectiveTimeScale(1)
                .setEffectiveWeight(1)
                .fadeIn(0.3)
                .play();
        }
    }

    // --- FINAL, CORRECTED VERSION OF handleInput ---
    function handleInput(dt) {
        if (!player) return;

        // Determine final movement vectors from all possible inputs
        // Note: Inverted joystick 'turn' to match keyboard rotation direction.
        let finalTurn = move.turn !== 0 ? -move.turn : 0;
        if (keyboardState['ArrowLeft'] || keyboardState['KeyA']) finalTurn = 1.0;
        if (keyboardState['ArrowRight'] || keyboardState['KeyD']) finalTurn = -1.0;

        let finalForward = move.forward;
        if (keyboardState['ArrowUp'] || keyboardState['KeyW']) finalForward = 1.0;
        if (keyboardState['ArrowDown'] || keyboardState['KeyS']) finalForward = -1.0;

        // Apply the final movement and rotation
        if (finalTurn !== 0) {
            player.rotation.y += finalTurn * 2.5 * dt;
        }
        if (finalForward !== 0) {
            player.translateZ(finalForward * 5 * dt);
        }

        // Check if there was ANY movement to decide the animation
        const isMoving = finalTurn !== 0 || finalForward !== 0;

        if (isMoving && animationActions.run) {
            setAction(animationActions.run);
        } else if (!isMoving && animationActions.idle) {
            setAction(animationActions.idle);
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();
        const now = clock.elapsedTime * 1000;

        if (mixer) mixer.update(dt);

        controls.update();

        if (player) {
            if (targetPosition) {
                if (animationActions.run) setAction(animationActions.run);
                const distance = player.position.distanceTo(targetPosition);
                if (distance > 0.1) {
                    const targetDirection = new THREE.Vector3().subVectors(targetPosition, player.position).normalize();
                    const targetQuaternion = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), targetDirection);
                    player.quaternion.slerp(targetQuaternion, 0.1);
                    player.translateZ(Math.min(5 * dt, distance));
                } else {
                    targetPosition = null;
                     if (animationActions.idle) setAction(animationActions.idle);
                }
            } else {
                handleInput(dt);
            }

            const halfSize = 40 / 2 - 0.5;
            player.position.x = Math.max(-halfSize, Math.min(halfSize, player.position.x));
            player.position.z = Math.max(-halfSize, Math.min(halfSize, player.position.z));
            controls.target.set(player.position.x, player.position.y + 1, player.position.z);

            if (now - lastUpdateTime > UPDATE_INTERVAL) {
                lastUpdateTime = now;
                window.flutter_inappwebview.callHandler('updatePosition', {
                    x: player.position.x, y: player.position.z, rotation: player.rotation.y
                });
            }
        }
        renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
